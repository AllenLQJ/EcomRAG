services:
  milvus:
    image: milvusdb/milvus:v2.5.10
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    command: [milvus, run, standalone]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
      - ./backend/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  mysql:
    image: mysql:8.0
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecomrag}
      MYSQL_USER: ${MYSQL_USER:-ecomrag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, --silent]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "127.0.0.1:6379:6379"
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  # 知识图谱演示用，按需启动：docker compose --profile graph up -d neo4j
  neo4j:
    image: neo4j:5.26.0-community
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    profiles: [graph]
    environment:
      # 放在 profile 里，未设置密码时不影响其他服务；启动 neo4j 前须在 .env 设置 NEO4J_PASSWORD（至少 8 位）
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ./volumes/neo4j:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
