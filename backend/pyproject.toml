[project]
name = "ecomrag-backend"
version = "0.1.0"
description = "电商 RAG 智能客服后端脚手架"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "pymilvus>=2.4,<2.6",
    "FlagEmbedding>=1.3,<2",
    "torch>=2.2,<3",
    "pymysql>=1.1,<2",
    "redis>=5,<7",
    "rank-bm25>=0.2.2,<0.3",
    "jieba>=0.42.1,<0.43",
    "python-docx>=1.1,<2",
    "pymupdf>=1.24,<2",
    "langchain-text-splitters>=0.3,<2",
    "neo4j>=5.20,<6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
