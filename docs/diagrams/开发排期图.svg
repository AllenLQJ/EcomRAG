<text x="453" y="238" font-size="11.5" font-weight="400" fill="#16171A" text-anchor="middle">curl 跑通演示 1–5</text>
<text x="453" y="254" font-size="11.5" font-weight="400" fill="#5C6068" text-anchor="middle">唯一硬门槛</text>
<path d="M728 180l8 8l-8 8l-8 -8z" fill="#EDEDEA" stroke="#8A8E95" stroke-width="1.25"/>
<text x="736" y="220" font-size="13" font-weight="600" fill="#16171A" text-anchor="end">M3 验收</text>
<text x="736" y="238" font-size="11.5" font-weight="400" fill="#5C6068" text-anchor="end">验收清单全勾</text>
<text x="736" y="254" font-size="11.5" font-weight="400" fill="#5C6068" text-anchor="end">可演示</text>
<rect x="24" y="276" width="712" height="40" rx="8" fill="#EDEDEA" stroke="#8A8E95" stroke-width="1.25"/>
<text x="40" y="301" font-size="13" font-weight="600" fill="#16171A" text-anchor="start">关键路径</text>
<text x="112" y="301" font-size="12" font-weight="400" fill="#16171A" text-anchor="start">环境 → 入库 → retrieve() → 带引用生成 → pipeline 串联 → M2；前端在 M2 之后</text>
</svg>