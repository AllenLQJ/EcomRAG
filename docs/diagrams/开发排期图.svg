<line x1="234.0" x2="234.0" y1="160" y2="188" stroke="#D6D6D1"/>
<text x="182" y="88" font-size="13" font-weight="600" fill="#16171A" text-anchor="start">阶段 1</text>
<text x="182" y="106" font-size="11.5" font-weight="400" fill="#5C6068" text-anchor="start">约 3.5 小时</text>
<text x="182" y="128" font-size="11.5" font-weight="400" fill="#16171A" text-anchor="start">脚手架、LLM 调通</text>
<text x="182" y="146" font-size="11.5" font-weight="400" fill="#16171A" text-anchor="start">入库脚本</text>
<rect x="316" y="64" width="128" height="96" rx="8" fill="none" stroke="#8A8E95" stroke-width="1.25"/>
