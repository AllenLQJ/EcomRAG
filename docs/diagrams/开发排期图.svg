<text x="328" y="106" font-size="11.5" font-weight="400" fill="#5C6068" text-anchor="start">约 4.5 小时</text>
<text x="328" y="128" font-size="11.5" font-weight="400" fill="#16171A" text-anchor="start">检索、路由、生成</text>
<text x="328" y="146" font-size="11.5" font-weight="400" fill="#16171A" text-anchor="start">FAQ、缓存、串联</text>
<rect x="462" y="64" width="128" height="96" rx="8" fill="none" stroke="#8A8E95" stroke-width="1.25"/>
<line x1="526.0" x2="526.0" y1="160" y2="188" stroke="#D6D6D1"/>
<text x="474" y="88" font-size="13" font-weight="600" fill="#16171A" text-anchor="start">阶段 3</text>
<text x="474" y="106" font-size="11.5" font-weight="400" fill="#5C6068" text-anchor="start">约 3 小时</text>
<text x="474" y="128" font-size="11.5" font-weight="400" fill="#16171A" text-anchor="start">前端单页</text>
<text x="474" y="146" font-size="11.5" font-weight="400" fill="#16171A" text-anchor="start">联调、限流</text>
<rect x="608" y="64" width="128" height="96" rx="8" fill="none" stroke="#8A8E95" stroke-width="1.25"/>
