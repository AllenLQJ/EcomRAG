<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Noto Sans SC','PingFang SC',system-ui,sans-serif"><rect width="760" height="340" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8E95"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#16171A" text-anchor="start">真实 RAG 链路跑通是唯一硬门槛</text>
<text x="24" y="48" font-size="11.5" font-weight="400" fill="#5C6068" text-anchor="start">阶段宽度不按比例，总工期约 1.5 天</text>
