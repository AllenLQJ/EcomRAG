<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>栖木客服 · 手机端</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#3346C8}a:hover{color:#23339A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F4; color: #16171A; font-family: 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #E4E4E0">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" fill="#16171A"></rect><path d="M9 19V9h4.5a3 3 0 0 1 0 6H9m5 0 5 4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-family: 'Noto Serif SC', serif; font-size: 16px; font-weight: 600">栖木客服</span>
    </div>
    <a href="#" style="font-size: 13px; color: #16171A; text-decoration: none; height: 44px; display: inline-flex; align-items: center">人工客服</a>
  </header>

  <main style="flex: 1; min-height: 0; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 600; line-height: 1.4">你好，我是栖木的智能客服</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #5C6068">售后、配送、发票、商品参数，都可以问我。</p>
    </div>

    <div style="display: flex; justify-content: flex-end">
      <div style="max-width: 280px; background: #16171A; color: #FFFFFF; font-size: 15px; line-height: 1.7; padding: 10px 16px; border-radius: 18px 18px 4px 18px">你们支持寄到火星吗？</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: #FBF1EA; color: #8A3D12; font-size: 12px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #B4541A"></span>未找到答案</span>
      <p style="margin: 0; font-size: 15px; line-height: 1.8">抱歉，店铺资料里没有找到相关说明。为避免给你不准确的信息，建议联系人工客服确认。</p>
      <div style="display: flex; gap: 8px">
        <a href="#" style="flex: 1; height: 44px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center">联系人工客服</a>
        <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #D6D6D1; background: #FFFFFF; color: #16171A; font: inherit; font-size: 14px; cursor: pointer">换个问法</button>
      </div>
    </div>
  </main>

  <footer style="flex-shrink: 0; padding: 12px 16px 28px; background: #F6F6F4; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button style="flex-shrink: 0; font: inherit; font-size: 13px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4E4E0; background: #FFFFFF; color: #16171A">运费怎么算</button>
      <button style="flex-shrink: 0; font: inherit; font-size: 13px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4E4E0; background: #FFFFFF; color: #16171A">发票怎么开</button>
      <button style="flex-shrink: 0; font: inherit; font-size: 13px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #E4E4E0; background: #FFFFFF; color: #16171A">退货流程</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #D6D6D1; border-radius: 18px; padding: 6px 6px 6px 16px">
      <label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">输入问题</label>
      <input id="mq" type="text" placeholder="输入你的问题" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; color: #16171A; background: transparent">
      <button aria-label="发送" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 14V4m0 0L4.5 8.5M9 4l4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#16171A","options":["#16171A","#3346C8","#1F5E4E","#8A4B2A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#16171A' };
  }
}
</script>
</body>
</html>
